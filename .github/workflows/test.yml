name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    # Keep the transcribe engine CPU-only so packaged artifacts do not change
    # when a runner image happens to add Vulkan development files.
    env:
      VOICE_TYPE_VULKAN: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The engine build is the slowest step. Its stamp keys off the pinned
      # revision and build flags, so a cached tree skips straight through.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/transcribe
          key: transcribe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-transcribe.sh', 'scripts/generate-transcribe-pkgconfig.go') }}
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libxkbcommon-dev pkg-config ibus dbus-x11 xvfb gnome-settings-daemon-common shellcheck
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check build
      - name: Mock providers and isolated IBus
        run: VOICE_TYPE_TEST_IBUS_DAEMON=/usr/bin/ibus-daemon go test -race ./...
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/transcribe/pkgconfig
      - name: Native application and tray
        run: xvfb-run -a make native-check
        env:
          GDK_BACKEND: x11
          # WebKit's bubblewrap sandbox cannot create a user namespace on the
          # hosted runner; the packaged application keeps its normal sandbox.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      # Packages are built only by the release workflow. Clean-container
      # installs are a manual gate: `make packages && make verify-packages`.
