name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Read version from VERSION
        id: version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          if (( ${VERSION%%.*} < 5 )); then
            echo "Refusing to publish a pre-v5 release from the v5 workflow" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            TAGGED_SHA=$(git rev-list -n 1 "v${VERSION}")
            if [ "$TAGGED_SHA" = "$GITHUB_SHA" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Tag v${VERSION} already targets this commit; resuming the release"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag v${VERSION} already belongs to $TAGGED_SHA, skipping"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} is new, releasing"
          fi

  validate:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l *.go)
          if [ -n "$UNFORMATTED" ]; then
            echo "Not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check installer scripts
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          shellcheck -s sh install.sh uninstall.sh

  release:
    needs: [check-version, validate]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # One job keeps the checked source, binaries, checksums, tag, and release
      # on the same workflow SHA without transferring assets between runners.
      - name: Build and verify release assets
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          BUILD_ROOT="${RUNNER_TEMP}/voice-type-release"
          mkdir -p "$BUILD_ROOT"

          for SPEC in x64:amd64 arm64:arm64; do
            ARCH=${SPEC%%:*}
            GOARCH=${SPEC##*:}
            DIR="voice-type-${ARCH}"

            mkdir -p "$BUILD_ROOT/$DIR"
            GOOS=linux GOARCH="$GOARCH" go build \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$BUILD_ROOT/$DIR/voice-type" .
            file "$BUILD_ROOT/$DIR/voice-type"

            BUILD_INFO=$(go version -m "$BUILD_ROOT/$DIR/voice-type")
            printf '%s\n' "$BUILD_INFO"
            printf '%s\n' "$BUILD_INFO" | grep -F "main.version=${VERSION}"
            printf '%s\n' "$BUILD_INFO" | grep -F "GOARCH=${GOARCH}"
            printf '%s\n' "$BUILD_INFO" | grep -F "CGO_ENABLED=0"
            printf '%s\n' "$BUILD_INFO" | grep -F "vcs.revision=${GITHUB_SHA}"
            printf '%s\n' "$BUILD_INFO" | grep -F "vcs.modified=false"
            if [ "$GOARCH" = "amd64" ]; then
              test "$("$BUILD_ROOT/$DIR/voice-type" version)" = "$VERSION"
            fi
          done

          for ARCH in x64 arm64; do
            DIR="voice-type-${ARCH}"
            ARCHIVE="voice-type-v5-linux-${ARCH}.tar.gz"
            tar -czf "$ARCHIVE" -C "$BUILD_ROOT" "$DIR/"
            tar -tzf "$ARCHIVE" | grep -qx "$DIR/voice-type"
          done

          printf '# Checksums for voice-type binaries\n' > checksums.txt
          sha256sum voice-type-v5-linux-x64.tar.gz >> checksums.txt
          sha256sum voice-type-v5-linux-arm64.tar.gz >> checksums.txt
          sha256sum -c checksums.txt
          test "$(grep -c voice-type-v5-linux checksums.txt)" -eq 2

      - name: Ensure release tag targets this build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA"
          fi

      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            CREATE_FLAGS=(--verify-tag --generate-notes --title "$TAG" --draft)
            if [[ "$VERSION" == *-* ]]; then
              CREATE_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${CREATE_FLAGS[@]}"
          fi

          gh release upload "$TAG" \
            voice-type-v5-linux-x64.tar.gz \
            voice-type-v5-linux-arm64.tar.gz \
            checksums.txt \
            --clobber

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          test "$(printf '%s\n' "$ASSETS" | wc -l)" -eq 3
          for EXPECTED in \
            voice-type-v5-linux-x64.tar.gz \
            voice-type-v5-linux-arm64.tar.gz \
            checksums.txt; do
            printf '%s\n' "$ASSETS" | grep -qx "$EXPECTED"
          done

          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
