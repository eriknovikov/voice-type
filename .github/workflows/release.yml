name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          (( ${VERSION%%.*} >= 6 ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1 && [ "$(git rev-list -n 1 "v$VERSION")" != "$GITHUB_SHA" ]; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            goarch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    # Keep the transcribe engine CPU-only so packaged artifacts do not change
    # when a runner image happens to add Vulkan development files.
    env:
      VOICE_TYPE_VULKAN: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libxkbcommon-dev pkg-config ibus dbus-x11 xvfb gnome-settings-daemon-common shellcheck
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check build
      - name: Mock providers and isolated IBus
        run: VOICE_TYPE_TEST_IBUS_DAEMON=/usr/bin/ibus-daemon go test -race ./...
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/transcribe/pkgconfig
      - name: Native application and tray
        run: xvfb-run -a make native-check
        env:
          GDK_BACKEND: x11
          # WebKit's bubblewrap sandbox cannot create a user namespace on the
          # hosted runner; the packaged application keeps its normal sandbox.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      - name: Install packaging tool
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build distribution packages
        run: make packages
      - name: Verify application build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(build/voice-type --version)" = "$VERSION"
          INFO=$(go version -m build/voice-type)
          printf '%s\n' "$INFO" | grep -F "main.version=$VERSION"
          printf '%s\n' "$INFO" | grep -F "GOARCH=$GOARCH"
          printf '%s\n' "$INFO" | grep -F 'CGO_ENABLED=1'
          printf '%s\n' "$INFO" | grep -F "vcs.revision=$GITHUB_SHA"
          printf '%s\n' "$INFO" | grep -F 'vcs.modified=false'
      - name: Install packages in clean distributions
        run: ./scripts/verify-packages.sh
      - name: Collect release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp build/packages/* "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-type-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: voice-type-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Publish verified assets
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.rpm' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 1
          FILES=$(find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -printf '%f\n' | sort)
          printf '%s\n' "$FILES"
          # shellcheck disable=SC2086
          sha256sum $FILES > checksums.txt
          sha256sum -c checksums.txt
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=(--target "$GITHUB_SHA" --generate-notes --title "$TAG" --draft)
            if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = true ]; then
            test "$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES checksums.txt --clobber
          fi
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          test "$(printf '%s\n' "$ASSETS" | wc -l)" -eq $(($(printf '%s\n' "$FILES" | wc -l) + 1))
          printf '%s\n' "$FILES" | while read -r NAME; do
            printf '%s\n' "$ASSETS" | grep -qx "$NAME"
          done
          printf '%s\n' "$ASSETS" | grep -qx checksums.txt
          if [ "$IS_DRAFT" = true ]; then
            if [[ "$VERSION" == *-* ]]; then
              gh release edit "$TAG" --draft=false --prerelease
            else
              gh release edit "$TAG" --draft=false --prerelease=false --latest
            fi
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
