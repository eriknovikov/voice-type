name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from constants.ts
        id: version
        run: |
          VERSION=$(grep -oP 'CURRENT_VERSION = "\K[^"]+' src/constants.ts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} is new, releasing"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
          - arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          mkdir -p build
          bun build src/index.ts --compile --target=bun-linux-${{ matrix.arch }} --outfile build/voice-type

      - name: Create tarball
        run: |
          mkdir -p voice-type-${{ matrix.arch }}
          cp build/voice-type voice-type-${{ matrix.arch }}/
          tar -czf voice-type-linux-${{ matrix.arch }}.tar.gz voice-type-${{ matrix.arch }}/

      - name: Generate hash
        run: sha256sum voice-type-linux-${{ matrix.arch }}.tar.gz > voice-type-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-type-${{ matrix.arch }}
          path: |
            voice-type-linux-${{ matrix.arch }}.tar.gz
            voice-type-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums.txt
        run: |
          cd artifacts
          printf '# Checksums for voice-type binaries\n' > checksums.txt
          find . -name "*.sha256" -exec cat {} >> checksums.txt \;
          test "$(grep -c voice-type-linux checksums.txt)" -eq 2

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          files: |
            artifacts/*/voice-type-linux-x64.tar.gz
            artifacts/*/voice-type-linux-arm64.tar.gz
            artifacts/checksums.txt
          prerelease: ${{ contains(needs.check-version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
