name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} is new, releasing"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CGO off: both dependencies are pure Go, and the release binary must be
      # static so it runs on any distro regardless of libc.
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -ldflags="-s -w -X main.version=${{ needs.check-version.outputs.version }}" \
            -o build/voice-type .
          file build/voice-type

      # Asset names carry the v5 marker: v4 binaries in the wild self-update by
      # looking for voice-type-linux-<arch>.tar.gz in the latest release, and
      # must fail loudly rather than swap themselves for a Go binary.
      - name: Create tarball
        run: |
          mkdir -p voice-type-${{ matrix.arch }}
          cp build/voice-type voice-type-${{ matrix.arch }}/
          tar -czf voice-type-v5-linux-${{ matrix.arch }}.tar.gz voice-type-${{ matrix.arch }}/

      - name: Generate hash
        run: sha256sum voice-type-v5-linux-${{ matrix.arch }}.tar.gz > voice-type-v5-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-type-${{ matrix.arch }}
          path: |
            voice-type-v5-linux-${{ matrix.arch }}.tar.gz
            voice-type-v5-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums.txt
        run: |
          cd artifacts
          printf '# Checksums for voice-type binaries\n' > checksums.txt
          find . -name "*.sha256" -exec cat {} >> checksums.txt \;
          test "$(grep -c voice-type-v5-linux checksums.txt)" -eq 2

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          files: |
            artifacts/*/voice-type-v5-linux-x64.tar.gz
            artifacts/*/voice-type-v5-linux-arm64.tar.gz
            artifacts/checksums.txt
          prerelease: ${{ contains(needs.check-version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
