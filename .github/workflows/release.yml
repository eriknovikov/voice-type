name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read version from VERSION
        id: version
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          if (( ${VERSION%%.*} < 5 )); then
            echo "Refusing to publish a pre-v5 release from the v5 workflow" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            TAGGED_SHA=$(git rev-list -n 1 "v${VERSION}")
            if [ "$TAGGED_SHA" = "$GITHUB_SHA" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Tag v${VERSION} already targets this commit; resuming the release"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag v${VERSION} already belongs to $TAGGED_SHA, skipping"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} is new, releasing"
          fi

  validate:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l *.go)
          if [ -n "$UNFORMATTED" ]; then
            echo "Not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check installer scripts
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          shellcheck -s sh install.sh uninstall.sh

  build:
    needs: [check-version, validate]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # CGO off: both dependencies are pure Go, and the release binary must be
      # static so it runs on any distro regardless of libc.
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p build
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o build/voice-type .
          file build/voice-type
          BUILD_INFO=$(go version -m build/voice-type)
          printf '%s\n' "$BUILD_INFO"
          printf '%s\n' "$BUILD_INFO" | grep -F "main.version=${VERSION}"
          printf '%s\n' "$BUILD_INFO" | grep -F "GOARCH=${GOARCH}"
          printf '%s\n' "$BUILD_INFO" | grep -F "CGO_ENABLED=0"
          printf '%s\n' "$BUILD_INFO" | grep -F "vcs.revision=${GITHUB_SHA}"
          printf '%s\n' "$BUILD_INFO" | grep -F "vcs.modified=false"
          if [ "$GOARCH" = "amd64" ]; then
            test "$(build/voice-type version)" = "$VERSION"
          fi

      # Asset names carry the v5 marker: v4 binaries in the wild self-update by
      # looking for voice-type-linux-<arch>.tar.gz in the latest release, and
      # must fail loudly rather than swap themselves for a Go binary.
      - name: Create tarball
        run: |
          mkdir -p voice-type-${{ matrix.arch }}
          cp build/voice-type voice-type-${{ matrix.arch }}/
          tar -czf voice-type-v5-linux-${{ matrix.arch }}.tar.gz voice-type-${{ matrix.arch }}/
          tar -tzf voice-type-v5-linux-${{ matrix.arch }}.tar.gz \
            | grep -qx "voice-type-${{ matrix.arch }}/voice-type"

      - name: Generate hash
        run: sha256sum voice-type-v5-linux-${{ matrix.arch }}.tar.gz > voice-type-v5-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-type-${{ matrix.arch }}
          path: |
            voice-type-v5-linux-${{ matrix.arch }}.tar.gz
            voice-type-v5-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create checksums.txt
        run: |
          for dir in artifacts/voice-type-*; do
            (cd "$dir" && sha256sum -c ./*.sha256)
          done
          test "$(find artifacts -name 'voice-type-v5-linux-*.tar.gz' -type f | wc -l)" -eq 2
          cd artifacts
          printf '# Checksums for voice-type binaries\n' > checksums.txt
          find . -name "*.sha256" -exec cat {} >> checksums.txt \;
          test "$(grep -c voice-type-v5-linux checksums.txt)" -eq 2

      - name: Ensure release tag targets this build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA"
          fi

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*/voice-type-v5-linux-x64.tar.gz
            artifacts/*/voice-type-v5-linux-arm64.tar.gz
            artifacts/checksums.txt
          prerelease: ${{ contains(needs.check-version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
